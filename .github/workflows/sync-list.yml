name: Sync Shadowrocket .list

# 当仓库根目录的 YAML 规则文件有更新时，自动转换生成对应的 .list 文件并提交
on:
  push:
    branches:
      - main
    paths:
      - "*.yaml"
      - "scripts/convert_rule_provider.py"
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert YAML rule providers to Shadowrocket .list
        run: python3 scripts/convert_rule_provider.py

      - name: Commit and push generated .list files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.list"
          if git diff --cached --quiet; then
            echo "没有需要更新的 .list 文件"
          else
            git commit -m "chore: auto sync Shadowrocket .list from YAML [skip ci]"
            git push
          fi
